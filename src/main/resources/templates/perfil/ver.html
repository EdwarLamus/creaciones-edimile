<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Edimile Creaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="rounded-circle d-flex align-items-center justify-content-center"
                     style="width:56px; height:56px; background:#111; border:2px solid rgba(0,0,0,0.12); flex-shrink:0;">
                    <i class="bi bi-person-fill" style="font-size:1.6rem; color:#555;"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-0" th:text="${usuario.getNombreCompleto()}">Nombre Usuario</h4>
                    <p class="text-muted small mb-0" th:text="${usuario.getEmail()}">email@ejemplo.com</p>
                </div>
                <a th:href="@{/perfil/configuracion}" class="btn btn-sm btn-outline-dark ms-auto">
                    <i class="bi bi-pencil me-1"></i>Editar perfil
                </a>
            </div>

            <!-- Tarjeta de datos -->
            <div class="card border-0 shadow-sm mb-4" style="border-radius:12px; max-width:640px;">
                <div class="card-header bg-white border-bottom py-3 px-4">
                    <h6 class="fw-semibold mb-0">
                        <i class="bi bi-person-vcard me-2 text-muted"></i>Información personal
                    </h6>
                </div>
                <div class="card-body px-4 py-3">

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label text-muted small fw-semibold mb-1">NOMBRE</label>
                            <p class="mb-0 fw-medium" th:text="${usuario.getNombre()}">—</p>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small fw-semibold mb-1">APELLIDO</label>
                            <p class="mb-0 fw-medium" th:text="${usuario.getApellido()}">—</p>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-muted small fw-semibold mb-1">CORREO ELECTRÓNICO</label>
                            <div class="d-flex align-items-center gap-2">
                                <p class="mb-0 fw-medium" th:text="${usuario.getEmail()}">—</p>
                                <span class="badge bg-light text-muted border" style="font-size:0.7rem;">Solo lectura</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small fw-semibold mb-1">ROL</label>
                            <p class="mb-0">
                                <span class="badge text-bg-dark" th:text="${usuario.getRol()}">—</span>
                            </p>
                        </div>
                        <div class="col-6">
                            <label class="form-label text-muted small fw-semibold mb-1">ESTADO</label>
                            <p class="mb-0">
                                <span th:if="${usuario.isActivo()}"
                                      class="badge"
                                      style="background:#d1fae5; color:#065f46;">Activo</span>
                                <span th:unless="${usuario.isActivo()}"
                                      class="badge"
                                      style="background:#fee2e2; color:#991b1b;">Inactivo</span>
                            </p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Acceso rápido a cambiar contraseña -->
            <div class="card border-0 shadow-sm" style="border-radius:12px; max-width:640px;">
                <div class="card-body px-4 py-3 d-flex align-items-center justify-content-between">
                    <div>
                        <div class="fw-semibold" style="font-size:0.9rem;">Contraseña</div>
                        <div class="text-muted small">Última actualización desconocida</div>
                    </div>
                    <a th:href="@{/perfil/configuracion}" class="btn btn-sm btn-outline-dark">
                        <i class="bi bi-key me-1"></i>Cambiar contraseña
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
