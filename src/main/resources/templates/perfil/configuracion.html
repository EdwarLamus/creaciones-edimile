<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Perfil — Edimile Creaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex align-items-center gap-2 mb-4">
                <a th:href="@{/perfil}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h4 class="fw-bold mb-0">Configuración de perfil</h4>
                    <p class="text-muted small mb-0">Cambia tu contraseña de acceso al sistema</p>
                </div>
            </div>



            <!-- Tarjeta de cambio de contraseña -->
            <div class="card border-0 shadow-sm" style="border-radius:12px; max-width:560px;">
                <div class="card-header bg-white border-bottom py-3 px-4">
                    <h6 class="fw-semibold mb-0">
                        <i class="bi bi-shield-lock me-2 text-muted"></i>Cambiar contraseña
                    </h6>
                </div>
                <div class="card-body px-4 py-4">

                    <form th:action="@{/perfil/configuracion}" method="post" novalidate id="perfilForm">

                        <!-- Contraseña actual -->
                        <div class="mb-3">
                            <label for="passwordActual" class="form-label fw-semibold" style="font-size:0.875rem;">
                                Contraseña actual
                            </label>
                            <div class="input-group">
                                <input type="password" id="passwordActual" name="passwordActual"
                                       class="form-control border-end-0"
                                       placeholder="Tu contraseña actual" required
                                       autocomplete="current-password">
                                <button class="btn btn-outline-secondary border-start-0" type="button"
                                        tabindex="-1"
                                        onclick="togglePassword('passwordActual','iconAct')">
                                    <i class="bi bi-eye" id="iconAct"></i>
                                </button>
                            </div>
                        </div>

                        <hr class="my-3">

                        <!-- Nueva contraseña -->
                        <div class="mb-3">
                            <label for="passwordNueva" class="form-label fw-semibold" style="font-size:0.875rem;">
                                Nueva contraseña
                            </label>
                            <div class="input-group">
                                <input type="password" id="passwordNueva" name="passwordNueva"
                                       class="form-control border-end-0"
                                       placeholder="Mínimo 8 caracteres" required
                                       autocomplete="new-password"
                                       oninput="evaluarContrasena(this.value)">
                                <button class="btn btn-outline-secondary border-start-0" type="button"
                                        tabindex="-1"
                                        onclick="togglePassword('passwordNueva','iconNueva')">
                                    <i class="bi bi-eye" id="iconNueva"></i>
                                </button>
                            </div>

                            <!-- Criterios de validación en tiempo real -->
                            <div class="mt-2" id="criterios" style="display:none;">
                                <div class="criterio criterio-light" id="c-length">
                                    <i class="bi bi-x-circle-fill me-1"></i>Mínimo 8 caracteres
                                </div>
                                <div class="criterio criterio-light" id="c-upper">
                                    <i class="bi bi-x-circle-fill me-1"></i>Al menos una mayúscula (A-Z)
                                </div>
                                <div class="criterio criterio-light" id="c-number">
                                    <i class="bi bi-x-circle-fill me-1"></i>Al menos un número (0-9)
                                </div>
                                <div class="criterio criterio-light" id="c-special">
                                    <i class="bi bi-x-circle-fill me-1"></i>Al menos un carácter especial (!@#$%...)
                                </div>
                            </div>
                        </div>

                        <!-- Confirmar contraseña -->
                        <div class="mb-4">
                            <label for="passwordConfirmar" class="form-label fw-semibold" style="font-size:0.875rem;">
                                Confirmar nueva contraseña
                            </label>
                            <div class="input-group">
                                <input type="password" id="passwordConfirmar" name="passwordConfirmar"
                                       class="form-control border-end-0"
                                       placeholder="Repite la nueva contraseña" required
                                       autocomplete="new-password"
                                       oninput="evaluarCoincidencia()">
                                <button class="btn btn-outline-secondary border-start-0" type="button"
                                        tabindex="-1"
                                        onclick="togglePassword('passwordConfirmar','iconConf')">
                                    <i class="bi bi-eye" id="iconConf"></i>
                                </button>
                            </div>
                            <div class="criterio criterio-light mt-2" id="c-match" style="display:none;">
                                <i class="bi bi-x-circle-fill me-1"></i>Las contraseñas coinciden
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark px-4">
                                <i class="bi bi-check-lg me-1"></i>Guardar cambios
                            </button>
                            <a th:href="@{/perfil}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/password-validation.js}"></script>
</body>
</html>
