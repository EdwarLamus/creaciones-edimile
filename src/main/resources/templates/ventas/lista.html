<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-cart-check me-2 text-dark"></i>Ventas
                    </h3>
                    <p class="text-muted small mb-0">Registro y seguimiento de ventas realizadas.</p>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/ventas/nueva}" class="btn btn-dark">
                        <i class="bi bi-plus-lg me-1"></i>Nueva Venta
                    </a>
                    <a th:href="@{/ventas/exportar-excel}" class="btn btn-success">
                        <i class="bi bi-file-earmark-excel me-1"></i>Excel
                    </a>
                </div>
            </div>

            <!-- Alertas flash -->
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filtros -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body py-3">
                    <form method="get" th:action="@{/ventas}" class="row g-2 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label small fw-semibold mb-1">Buscar</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" name="q" class="form-control"
                                       placeholder="Número, cliente o vendedor…"
                                       th:value="${q}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold mb-1">Estado</label>
                            <select name="estado" class="form-select">
                                <option value="">— Todos —</option>
                                <option th:each="e : ${estados}"
                                        th:value="${e.name()}"
                                        th:text="${e.name()}"
                                        th:selected="${e.name() == estadoFiltro}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-dark w-100">
                                <i class="bi bi-funnel-fill me-1"></i>Filtrar
                            </button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/ventas}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-x-lg me-1"></i>Limpiar
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Número</th>
                                    <th>Cliente</th>
                                    <th>Vendedor</th>
                                    <th class="text-center">Fecha</th>
                                    <th class="text-center">Método Pago</th>
                                    <th class="text-end">Total</th>
                                    <th class="text-center">Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(ventas)}">
                                    <td colspan="8" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        No hay ventas registradas.
                                    </td>
                                </tr>
                                <tr th:each="v : ${ventas}">
                                    <td>
                                        <a th:href="@{/ventas/{id}(id=${v.id})}"
                                           class="fw-semibold text-dark text-decoration-none"
                                           th:text="${v.numero}">FAC-0001</a>
                                        <div th:if="${v.tieneCotizacion()}" class="small text-muted">
                                            <i class="bi bi-file-text me-1"></i>
                                            <span th:text="${v.cotizacionNumero}"></span>
                                        </div>
                                    </td>
                                    <td th:text="${v.clienteNombre}">—</td>
                                    <td th:text="${v.usuarioNombre}">—</td>
                                    <td class="text-center small">
                                        <span th:if="${v.fechaCreacion != null}"
                                              th:text="${#temporals.format(v.fechaCreacion.toDate().toInstant().atZone(T(java.time.ZoneId).of('America/Bogota')), 'dd/MM/yyyy')}">
                                        </span>
                                        <span th:if="${v.fechaCreacion == null}">—</span>
                                    </td>
                                    <td class="text-center">
                                        <span th:if="${v.metodoPago != null}" th:switch="${v.metodoPago.name()}">
                                            <span th:case="'EFECTIVO'"      class="badge bg-success bg-opacity-75">EFECTIVO</span>
                                            <span th:case="'TRANSFERENCIA'" class="badge bg-primary bg-opacity-75">TRANSFERENCIA</span>
                                            <span th:case="'CHEQUE'"        class="badge bg-secondary">CHEQUE</span>
                                            <span th:case="'TARJETA'"       class="badge bg-info text-dark">TARJETA</span>
                                            <span th:case="*"               class="badge bg-secondary" th:text="${v.metodoPago}"></span>
                                        </span>
                                        <span th:if="${v.metodoPago == null}" class="text-muted small">—</span>
                                    </td>
                                    <td class="text-end fw-semibold"
                                        th:text="${#numbers.formatDecimal(v.total, 1, 'COMMA', 0, 'POINT')}">
                                    </td>
                                    <td class="text-center">
                                        <span th:switch="${v.estado != null ? v.estado.name() : 'PENDIENTE'}">
                                            <span th:case="'PENDIENTE'" class="badge bg-warning text-dark">PENDIENTE</span>
                                            <span th:case="'PAGADA'"    class="badge bg-success">PAGADA</span>
                                            <span th:case="'ANULADA'"   class="badge bg-danger">ANULADA</span>
                                            <span th:case="*"           class="badge bg-secondary" th:text="${v.estado}"></span>
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/ventas/{id}(id=${v.id})}"
                                               class="btn btn-outline-dark" title="Ver detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                        </div>
                                        <!-- Eliminar (solo ADMIN) -->
                                        <form th:action="@{/ventas/{id}/eliminar(id=${v.id})}"
                                              method="post" class="d-inline ms-1"
                                              sec:authorize="hasRole('ADMIN')"
                                              onsubmit="return confirm('¿Está seguro de eliminar esta venta? Esta acción no se puede deshacer.')">
                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger"
                                                    title="Eliminar">
                                                <i class="bi bi-trash3"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div><!-- /page-content -->
    </div><!-- /wrapper -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
