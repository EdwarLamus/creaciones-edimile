<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Facturar ' + ${cotizacion.numero} + ' — Creaciones Edimile'">Facturar Cotización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-receipt me-2 text-dark"></i>
                        Facturar cotización <span th:text="${cotizacion.numero}" class="text-success"></span>
                    </h3>
                    <p class="text-muted small mb-0">Convierte esta cotización aprobada en una venta.</p>
                </div>
                <a th:href="@{/cotizaciones/{id}(id=${cotizacion.id})}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Volver a cotización
                </a>
            </div>

            <!-- Alerta flash -->
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-circle me-2"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <!-- Resumen de la cotización -->
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-dark text-white fw-semibold py-2">
                            <i class="bi bi-file-text me-1"></i>Resumen de la Cotización
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-sm-6">
                                    <p class="mb-1 small text-muted">Cliente</p>
                                    <p class="fw-semibold mb-0" th:text="${cotizacion.clienteNombre}">—</p>
                                    <p class="small text-muted mb-0" th:text="${cotizacion.clienteDocumento}">—</p>
                                </div>
                                <div class="col-sm-6">
                                    <p class="mb-1 small text-muted">Vendedor</p>
                                    <p class="fw-semibold mb-0" th:text="${cotizacion.usuarioNombre}">—</p>
                                </div>
                            </div>

                            <!-- Ítems -->
                            <div class="table-responsive">
                                <table class="table table-sm align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Producto</th>
                                            <th class="text-center">Cant.</th>
                                            <th class="text-end">P. Unit.</th>
                                            <th class="text-end">Subtotal</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="item : ${cotizacion.items}">
                                            <td>
                                                <span class="fw-semibold" th:text="${item.productoNombre}">—</span>
                                                <div th:if="${item.descripcionPersonalizacion != null}" class="small text-muted"
                                                     th:text="${item.descripcionPersonalizacion}"></div>
                                            </td>
                                            <td class="text-center" th:text="${item.cantidad}">1</td>
                                            <td class="text-end"
                                                th:text="${#numbers.formatDecimal(item.precioUnitario, 1, 'COMMA', 0, 'POINT')}"></td>
                                            <td class="text-end fw-semibold"
                                                th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}"></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Totales -->
                            <div class="d-flex justify-content-end mt-3">
                                <dl class="row text-end mb-0 small" style="min-width:240px;">
                                    <dt class="col-7 text-muted fw-normal">Subtotal</dt>
                                    <dd class="col-5 fw-semibold"
                                        th:text="${#numbers.formatDecimal(cotizacion.subtotal, 1, 'COMMA', 0, 'POINT')}"></dd>
                                    <dt class="col-7 text-muted fw-normal"
                                        th:text="'Descuento (' + ${cotizacion.descuentoPorcentaje} + '%)'">Descuento</dt>
                                    <dd class="col-5 text-danger"
                                        th:text="'- ' + ${#numbers.formatDecimal(cotizacion.descuentoValor, 1, 'COMMA', 0, 'POINT')}"></dd>
                                    <dt class="col-7 text-muted fw-normal"
                                        th:text="'IVA (' + ${cotizacion.ivaPorcentaje} + '%)'">IVA</dt>
                                    <dd class="col-5"
                                        th:text="${#numbers.formatDecimal(cotizacion.ivaValor, 1, 'COMMA', 0, 'POINT')}"></dd>
                                    <dt class="col-7 fw-bold fs-6 border-top pt-2">TOTAL</dt>
                                    <dd class="col-5 fw-bold fs-6 border-top pt-2 text-success"
                                        th:text="${#numbers.formatDecimal(cotizacion.total, 1, 'COMMA', 0, 'POINT')}"></dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Formulario de venta -->
                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-success text-white fw-semibold py-2">
                            <i class="bi bi-cart-check me-1"></i>Datos de la Venta
                        </div>
                        <div class="card-body">
                            <form th:action="@{/ventas/desde-cotizacion/{id}(id=${cotizacion.id})}" method="post">

                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">
                                        Método de pago <span class="text-danger">*</span>
                                    </label>
                                    <select name="metodoPago" class="form-select" required>
                                        <option value="">— Seleccionar —</option>
                                        <option th:each="mp : ${metodosPago}"
                                                th:value="${mp.name()}"
                                                th:text="${mp.name()}">
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Observaciones</label>
                                    <textarea name="observaciones" class="form-control" rows="3"
                                              placeholder="Notas adicionales (opcional)…"
                                              th:text="${cotizacion.observaciones}"></textarea>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-success">
                                        <i class="bi bi-check-circle me-2"></i>Crear venta
                                    </button>
                                    <a th:href="@{/cotizaciones/{id}(id=${cotizacion.id})}"
                                       class="btn btn-outline-secondary">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div><!-- /page-content -->
    </div><!-- /wrapper -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
