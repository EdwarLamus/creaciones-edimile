<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cliente != null} ? 'Editar Cliente — Creaciones Edimile' : 'Nuevo Cliente — Creaciones Edimile'">
        Cliente — Creaciones Edimile
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-person-plus me-2 text-primary"
                           th:if="${cliente == null}"></i>
                        <i class="bi bi-pencil-square me-2 text-primary"
                           th:unless="${cliente == null}"></i>
                        <span th:text="${cliente != null} ? 'Editar Cliente' : 'Nuevo Cliente'">
                            Nuevo Cliente
                        </span>
                    </h3>
                    <p class="text-muted small mb-0"
                       th:text="${cliente != null} ? 'Actualiza la información del cliente.' : 'Registra un nuevo cliente en el sistema.'">
                    </p>
                </div>
                <a th:href="@{/clientes}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Volver al listado
                </a>
            </div>

            <!-- Formulario -->
            <div class="card border-0 shadow-sm" style="max-width: 720px;">
                <div class="card-body p-4">

                    <!-- Nuevo: POST /clientes/nuevo  |  Editar: POST /clientes/{id}/editar -->
                    <form th:action="${cliente != null}
                                     ? @{/clientes/{id}/editar(id=${cliente.id})}
                                     : @{/clientes/nuevo}"
                          method="post">

                        <div class="row g-3">

                            <!-- Nombre -->
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-semibold">
                                    Nombre <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       id="nombre"
                                       name="nombre"
                                       th:value="${cliente?.nombre}"
                                       class="form-control"
                                       placeholder="Ej: María"
                                       required
                                       maxlength="80">
                            </div>

                            <!-- Apellido -->
                            <div class="col-md-6">
                                <label for="apellido" class="form-label fw-semibold">
                                    Apellido <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       id="apellido"
                                       name="apellido"
                                       th:value="${cliente?.apellido}"
                                       class="form-control"
                                       placeholder="Ej: Gómez"
                                       required
                                       maxlength="80">
                            </div>

                            <!-- Empresa (opcional) -->
                            <div class="col-12">
                                <label for="empresa" class="form-label fw-semibold">
                                    Empresa <span class="text-muted fw-normal">(opcional)</span>
                                </label>
                                <input type="text"
                                       id="empresa"
                                       name="empresa"
                                       th:value="${cliente?.empresa}"
                                       class="form-control"
                                       placeholder="Ej: Distribuidora XYZ S.A.S"
                                       maxlength="120">
                            </div>

                            <!-- Tipo de documento -->
                            <div class="col-md-4">
                                <label for="tipoDocumento" class="form-label fw-semibold">
                                    Tipo de documento <span class="text-danger">*</span>
                                </label>
                                <select id="tipoDocumento"
                                        name="tipoDocumento"
                                        class="form-select"
                                        required>
                                    <option value="" disabled
                                            th:selected="${cliente == null}">Seleccionar…</option>
                                    <option value="CC"
                                            th:selected="${cliente?.tipoDocumento == 'CC'}">
                                        CC — Cédula de Ciudadanía
                                    </option>
                                    <option value="NIT"
                                            th:selected="${cliente?.tipoDocumento == 'NIT'}">
                                        NIT — Número de Identificación Tributaria
                                    </option>
                                    <option value="CE"
                                            th:selected="${cliente?.tipoDocumento == 'CE'}">
                                        CE — Cédula de Extranjería
                                    </option>
                                    <option value="TI"
                                            th:selected="${cliente?.tipoDocumento == 'TI'}">
                                        TI — Tarjeta de Identidad
                                    </option>
                                    <option value="PASAPORTE"
                                            th:selected="${cliente?.tipoDocumento == 'PASAPORTE'}">
                                        Pasaporte
                                    </option>
                                </select>
                            </div>

                            <!-- Número de documento -->
                            <div class="col-md-8">
                                <label for="numeroDocumento" class="form-label fw-semibold">
                                    Número de documento <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       id="numeroDocumento"
                                       name="numeroDocumento"
                                       th:value="${cliente?.numeroDocumento}"
                                       class="form-control"
                                       placeholder="Ej: 1023456789"
                                       required
                                       pattern="[A-Za-z0-9\-]{5,20}"
                                       title="Solo letras, números y guión. Entre 5 y 20 caracteres. Sin espacios ni símbolos."
                                       maxlength="20">
                                <div class="form-text">Solo letras y números. Ej: 1023456789 o CE-12345. Debe ser único.</div>
                            </div>

                            <!-- Teléfono -->
                            <div class="col-md-6">
                                <label for="telefono" class="form-label fw-semibold">
                                    Teléfono <span class="text-danger">*</span>
                                </label>
                                <input type="tel"
                                       id="telefono"
                                       name="telefono"
                                       th:value="${cliente?.telefono}"
                                       class="form-control"
                                       placeholder="Ej: 300 123 4567"
                                       required
                                       pattern="[+]?[0-9][0-9 \-]{6,18}"
                                       title="Ingresa un número válido (7–15 dígitos, puede incluir +, espacios o guiones)"
                                       maxlength="20">
                                <div class="form-text">Solo dígitos. Ej: 3001234567 o +57 300 123 4567</div>
                            </div>

                            <!-- Email (opcional) -->
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">
                                    Correo electrónico <span class="text-muted fw-normal">(opcional)</span>
                                </label>
                                <input type="email"
                                       id="email"
                                       name="email"
                                       th:value="${cliente?.email}"
                                       class="form-control"
                                       placeholder="Ej: cliente@correo.com"
                                       maxlength="120">
                            </div>

                            <!-- Dirección (opcional) -->
                            <div class="col-12">
                                <label for="direccion" class="form-label fw-semibold">
                                    Dirección <span class="text-muted fw-normal">(opcional)</span>
                                </label>
                                <input type="text"
                                       id="direccion"
                                       name="direccion"
                                       th:value="${cliente?.direccion}"
                                       class="form-control"
                                       placeholder="Ej: Calle 10 # 5-23, Bogotá"
                                       maxlength="200">
                            </div>

                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-dark px-4">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${cliente != null} ? 'Guardar cambios' : 'Registrar cliente'">
                                    Guardar
                                </span>
                            </button>
                            <a th:href="@{/clientes}" class="btn btn-outline-secondary px-4">
                                Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
