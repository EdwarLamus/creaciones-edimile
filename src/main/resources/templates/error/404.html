<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .error-card { max-width: 580px; border-radius: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,.10); }
        .error-code { font-size: 5rem; font-weight: 800; letter-spacing: -.03em; color: #6366f1; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
<div class="error-card card border-0 p-5 text-center mx-3">
    <i class="bi bi-map text-primary mb-3" style="font-size:4rem;"></i>
    <p class="error-code mb-1">404</p>
    <h4 class="fw-bold mb-3">Página no encontrada</h4>
    <div class="alert alert-light border mb-4">
        La dirección que intentas visitar no existe o fue eliminada.<br>
        Verifica que la URL sea correcta.
    </div>
    <div class="d-flex gap-3 justify-content-center flex-wrap">
        <a href="javascript:history.back()" class="btn btn-primary px-4">
            <i class="bi bi-arrow-left-circle me-2"></i>Volver
        </a>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary px-4">
            <i class="bi bi-house-fill me-2"></i>Inicio
        </a>
    </div>
</div>
</body>
</html>
