<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="text-center px-4">
        <i class="bi bi-shield-x text-danger" style="font-size: 5rem;"></i>
        <h1 class="display-4 fw-bold mt-3 mb-1">403</h1>
        <h5 class="text-secondary mb-3">Acceso Denegado</h5>
        <p class="text-muted mb-4">
            No tienes permisos para acceder a esta sección.<br>
            Si crees que es un error, contacta al administrador del sistema.
        </p>
        <a th:href="@{/dashboard}" class="btn btn-danger px-4">
            <i class="bi bi-house-fill me-2"></i>Volver al inicio
        </a>
    </div>

</body>
</html>
