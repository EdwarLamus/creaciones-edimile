<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitulo != null ? errorTitulo + ' — Creaciones Edimile' : 'Error — Creaciones Edimile'}">Error — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .error-card {
            max-width: 600px;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,.10);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -.03em;
        }
        .code-400 { color: #f59e0b; }
        .code-403 { color: #ef4444; }
        .code-404 { color: #6366f1; }
        .code-500 { color: #ef4444; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="error-card card border-0 p-5 text-center mx-3">

    <!-- Ícono según código -->
    <div class="mb-3">
        <i th:if="${errorCodigo == '400'}" class="bi bi-exclamation-triangle-fill text-warning" style="font-size:4rem;"></i>
        <i th:if="${errorCodigo == '403'}" class="bi bi-shield-x text-danger" style="font-size:4rem;"></i>
        <i th:if="${errorCodigo == '404'}" class="bi bi-map text-primary" style="font-size:4rem;"></i>
        <i th:if="${errorCodigo == '500'}" class="bi bi-bug-fill text-danger" style="font-size:4rem;"></i>
        <i th:if="${errorCodigo == null or (errorCodigo != '400' and errorCodigo != '403' and errorCodigo != '404' and errorCodigo != '500')}"
           class="bi bi-x-octagon-fill text-secondary" style="font-size:4rem;"></i>
    </div>

    <!-- Código de error -->
    <p class="error-code mb-1"
       th:classappend="${errorCodigo != null ? 'code-' + errorCodigo : 'text-secondary'}"
       th:text="${errorCodigo != null ? errorCodigo : 'ERROR'}">400</p>

    <!-- Título -->
    <h4 class="fw-bold mb-3" th:text="${errorTitulo ?: 'Ha ocurrido un error'}">Dato inválido</h4>

    <!-- Mensaje descriptivo -->
    <div class="alert alert-light border mb-4 text-start" th:utext="${errorMensaje ?: 'No hay detalles disponibles.'}">
        El campo recibió un valor no válido.
    </div>

    <!-- Acciones -->
    <div class="d-flex gap-3 justify-content-center flex-wrap">
        <a th:href="${volverUrl ?: '/dashboard'}" class="btn btn-primary px-4">
            <i class="bi bi-arrow-left-circle me-2"></i>Volver
        </a>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary px-4">
            <i class="bi bi-house-fill me-2"></i>Inicio
        </a>
    </div>

    <!-- Info de contacto -->
    <p class="text-muted small mt-4 mb-0">
        Si el problema persiste, contacta al administrador del sistema.
    </p>

</div>

</body>
</html>
