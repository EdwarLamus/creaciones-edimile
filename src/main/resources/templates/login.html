<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Edimile Creaciones</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="login-bg d-flex align-items-center justify-content-center min-vh-100">

    <div class="login-wrapper">

        <!-- ================================================
             Tarjeta de Login
             ================================================ -->
        <div class="login-card">

                <!-- Logo de la empresa -->
                <div class="text-center mb-2">
                    <img th:src="@{/images/logo.png}"
                         src="/images/logo.png"
                         alt="Edimile Creaciones"
                         class="login-logo"
                         onerror="this.style.display='none'; document.getElementById('monogram').style.display='inline-flex';">
                    <!-- Fallback monograma -->
                    <div id="monogram" class="login-monogram mx-auto" style="display:none;">CEM</div>
                </div>

                <!-- Subtítulo -->
                <p class="text-center mb-4" style="color:rgba(255,255,255,0.38); font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase;">
                    Sistema de Gestión Empresarial
                </p>

                <!-- Alertas -->
                <div th:if="${errorMsg}"
                     class="alert alert-danger d-flex align-items-center py-2 mb-4"
                     role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
                    <div th:text="${errorMsg}" style="font-size:0.875rem;"></div>
                </div>
                <div th:if="${logoutMsg}"
                     class="alert alert-success d-flex align-items-center py-2 mb-4"
                     role="alert">
                    <i class="bi bi-check-circle-fill me-2 flex-shrink-0"></i>
                    <div th:text="${logoutMsg}" style="font-size:0.875rem;"></div>
                </div>

                <!-- ============================================
                     Formulario de Login
                     th:action: Thymeleaf agrega el token CSRF
                     automáticamente al generar la URL de acción.
                     ============================================ -->
                <form th:action="@{/login}" method="post" novalidate>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Correo electrónico
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-envelope text-muted"></i>
                            </span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control border-start-0 bg-light"
                                placeholder="usuario@creacionesedimile.com"
                                required
                                autofocus
                                autocomplete="email">
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-5">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control border-start-0 bg-light border-end-0"
                                placeholder="••••••••"
                                required
                                autocomplete="current-password">
                            <button class="btn btn-light border toggle-pwd" type="button"
                                    tabindex="-1" title="Mostrar/ocultar contraseña">
                                <i class="bi bi-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Botón Ingresar -->
                    <button type="submit" class="btn btn-login w-100 py-2 mb-3">
                        Ingresar al sistema
                        <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                    <!-- Enlace olvidé contraseña -->
                    <div class="text-center">
                        <a th:href="@{/forgot-password}"
                           style="font-size:0.8rem; color:rgba(255,255,255,0.38); text-decoration:none; transition:color 0.15s;"
                           onmouseover="this.style.color='rgba(255,255,255,0.7)'"
                           onmouseout="this.style.color='rgba(255,255,255,0.38)'">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                </form>

        </div>

        <!-- Pie de página -->
        <p class="text-center mt-4" style="color:rgba(255,255,255,0.20); font-size:0.75rem;">
            &copy; 2026 Edimile Creaciones &mdash; Todos los derechos reservados
        </p>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Toggle mostrar / ocultar contraseña
        document.querySelector('.toggle-pwd').addEventListener('click', function () {
            const input = document.getElementById('password');
            const icon  = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    </script>
</body>
</html>
