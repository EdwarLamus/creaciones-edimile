<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categoria != null} ? 'Editar Categoría — Creaciones Edimile' : 'Nueva Categoría — Creaciones Edimile'">
        Categoría — Creaciones Edimile
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-tag-fill me-2 text-success"></i>
                        <span th:text="${categoria != null} ? 'Editar Categoría' : 'Nueva Categoría'">
                            Categoría
                        </span>
                    </h3>
                    <p class="text-muted small mb-0"
                       th:text="${categoria != null} ? 'Actualiza el nombre o descripción de la categoría.' : 'Crea una nueva categoría para organizar los productos.'">
                    </p>
                </div>
                <a th:href="@{/productos/categorias}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Volver a Categorías
                </a>
            </div>

            <!-- Formulario -->
            <div class="card border-0 shadow-sm" style="max-width: 520px;">
                <div class="card-body p-4">

                    <form th:action="${categoria != null}
                                     ? @{/productos/categorias/{id}/editar(id=${categoria.id})}
                                     : @{/productos/categorias/nueva}"
                          method="post"
                          novalidate>

                        <div class="row g-3">

                            <!-- Nombre -->
                            <div class="col-12">
                                <label for="nombre" class="form-label fw-semibold">
                                    Nombre <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       id="nombre"
                                       name="nombre"
                                       th:value="${categoria?.nombre}"
                                       class="form-control"
                                       placeholder="Ej: Uniformes Deportivos"
                                       required
                                       maxlength="80">
                            </div>

                            <!-- Descripción -->
                            <div class="col-12">
                                <label for="descripcion" class="form-label fw-semibold">
                                    Descripción <span class="text-muted fw-normal">(opcional)</span>
                                </label>
                                <textarea id="descripcion"
                                          name="descripcion"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Breve descripción de qué productos agrupa esta categoría…"
                                          maxlength="300"
                                          th:text="${categoria?.descripcion}"></textarea>
                            </div>

                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-dark px-4">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${categoria != null} ? 'Guardar cambios' : 'Crear categoría'">
                                    Guardar
                                </span>
                            </button>
                            <a th:href="@{/productos/categorias}" class="btn btn-outline-secondary px-4">
                                Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
