<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías de Productos — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-tags-fill me-2 text-success"></i>Categorías de Productos
                    </h3>
                    <p class="text-muted small mb-0">
                        Organiza los productos por categoría.
                    </p>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/productos}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Volver a Productos
                    </a>
                    <a th:href="@{/productos/categorias/nueva}" class="btn btn-dark">
                        <i class="bi bi-plus-circle me-1"></i>Nueva Categoría
                    </a>
                </div>
            </div>

            <!-- Tabla de categorías -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr class="table-dark">
                                    <th class="ps-4 py-3">Nombre</th>
                                    <th class="py-3">Descripción</th>
                                    <th class="py-3">Estado</th>
                                    <th class="py-3 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(categorias)}">
                                    <td colspan="4" class="text-center text-muted py-5">
                                        <i class="bi bi-tags fs-2 d-block mb-2"></i>
                                        No hay categorías registradas.
                                        <a th:href="@{/productos/categorias/nueva}">Crear la primera</a>.
                                    </td>
                                </tr>
                                <tr th:each="cat : ${categorias}">
                                    <td class="ps-4 fw-semibold" th:text="${cat.nombre}">Nombre</td>
                                    <td class="text-muted">
                                        <span th:text="${cat.descripcion}"
                                              th:if="${cat.descripcion != null and !#strings.isEmpty(cat.descripcion)}">
                                            Descripción
                                        </span>
                                        <span class="fst-italic small" th:unless="${cat.descripcion != null and !#strings.isEmpty(cat.descripcion)}">—</span>
                                    </td>
                                    <td>
                                        <span th:if="${cat.activo}"
                                              class="badge bg-success-subtle text-success border border-success-subtle">
                                            <i class="bi bi-circle-fill me-1" style="font-size:0.5rem;"></i>Activa
                                        </span>
                                        <span th:unless="${cat.activo}"
                                              class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">
                                            <i class="bi bi-circle me-1" style="font-size:0.5rem;"></i>Inactiva
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <div class="d-flex justify-content-center gap-1">
                                            <a th:href="@{/productos/categorias/{id}/editar(id=${cat.id})}"
                                               class="btn btn-sm btn-outline-dark"
                                               title="Editar categoría">
                                                <i class="bi bi-pencil-fill"></i>
                                            </a>
                                            <form th:if="${cat.activo}"
                                                  th:action="@{/productos/categorias/{id}/estado(id=${cat.id})}"
                                                  method="post" class="d-inline"
                                                  onsubmit="return confirm('¿Desactivar esta categoría?')">
                                                <input type="hidden" name="activo" value="false">
                                                <button type="submit"
                                                        class="btn btn-sm btn-outline-warning"
                                                        title="Desactivar">
                                                    <i class="bi bi-toggle-off"></i>
                                                </button>
                                            </form>
                                            <form th:unless="${cat.activo}"
                                                  th:action="@{/productos/categorias/{id}/estado(id=${cat.id})}"
                                                  method="post" class="d-inline">
                                                <input type="hidden" name="activo" value="true">
                                                <button type="submit"
                                                        class="btn btn-sm btn-outline-success"
                                                        title="Activar">
                                                    <i class="bi bi-toggle-on"></i>
                                                </button>
                                            </form>
                                            <!-- Eliminar (solo ADMIN) -->
                                            <form th:action="@{/productos/categorias/{id}/eliminar(id=${cat.id})}"
                                                  method="post" class="d-inline"
                                                  sec:authorize="hasRole('ADMIN')"
                                                  onsubmit="return confirm('\u00bfEst\u00e1 seguro de eliminar esta categor\u00eda? Esta acci\u00f3n no se puede deshacer.')">
                                                <button type="submit"
                                                        class="btn btn-sm btn-outline-danger"
                                                        title="Eliminar">
                                                    <i class="bi bi-trash3"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-top text-muted small px-4 py-2"
                     th:if="${!#lists.isEmpty(categorias)}">
                    <span th:text="${#lists.size(categorias)}">0</span> categoría(s) registrada(s).
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
