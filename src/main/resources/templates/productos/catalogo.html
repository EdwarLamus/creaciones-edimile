<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <style>
        .catalogo-card {
            border-radius: 14px;
            background: #fff;
            border: 1px solid #e8e8e8;
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            overflow: hidden;
        }
        .catalogo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,.10);
            border-color: #222;
        }
        .catalogo-img {
            height: 180px;
            object-fit: cover;
            width: 100%;
            background: #f3f3f3;
        }
        .catalogo-img-placeholder {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f3f3;
            color: #b0b0b0;
            font-size: 2.5rem;
        }
        .precio-badge {
            font-size: 1rem;
            font-weight: 700;
            color: #111;
        }
        .filter-pill {
            border-radius: 50px;
            font-size: .82rem;
            padding: .35rem .9rem;
            transition: background-color .15s;
        }
        .filter-pill.active {
            background-color: #111;
            color: #fff;
            border-color: #111;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-grid-3x3-gap me-2 text-success"></i>Catálogo de Productos
                    </h3>
                    <p class="text-muted small mb-0">Vista visual del catálogo activo.</p>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/productos}" class="btn btn-outline-secondary">
                        <i class="bi bi-list-ul me-1"></i>Ver lista
                    </a>
                    <a th:href="@{/productos/nuevo}" class="btn btn-dark"
                       sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-plus-circle me-1"></i>Nuevo Producto
                    </a>
                </div>
            </div>

            <!-- Filtro por categoría (pills) -->
            <div class="d-flex flex-wrap gap-2 mb-4">
                <a th:href="@{/productos/catalogo}"
                   th:classappend="${categoriaId == null or #strings.isEmpty(categoriaId)} ? ' active' : ''"
                   class="btn btn-outline-dark filter-pill">
                    Todos
                </a>
                <a th:each="cat : ${categorias}"
                   th:href="@{/productos/catalogo(categoriaId=${cat.id})}"
                   th:text="${cat.nombre}"
                   th:classappend="${cat.id == categoriaId} ? ' active' : ''"
                   class="btn btn-outline-dark filter-pill">
                    Categoría
                </a>
            </div>

            <!-- Grid de tarjetas -->
            <div th:if="${#lists.isEmpty(productos)}"
                 class="text-center text-muted py-5">
                <i class="bi bi-box fs-1 d-block mb-2"></i>
                No hay productos activos en esta categoría.
                <a th:href="@{/productos/catalogo}" class="d-block mt-1">Ver todos</a>
            </div>

            <div class="row g-4" th:unless="${#lists.isEmpty(productos)}">
                <div class="col-sm-6 col-md-4 col-xl-3"
                     th:each="p : ${productos}"
                     th:if="${p.activo}">
                    <div class="catalogo-card shadow-sm h-100">

                        <!-- Imagen -->
                        <img th:if="${p.tieneImagen()}"
                             th:src="${p.imagenUrl}"
                             class="catalogo-img"
                             th:alt="${p.nombre}">
                        <div th:unless="${p.tieneImagen()}"
                             class="catalogo-img-placeholder">
                            <i class="bi bi-image"></i>
                        </div>

                        <!-- Info -->
                        <div class="p-3">
                            <span class="badge bg-light text-dark border fw-normal small mb-1"
                                  th:text="${p.categoriaNombre}">Categoría</span>
                            <h6 class="fw-bold mb-1 mt-1" th:text="${p.nombre}">Nombre</h6>
                            <p class="text-muted small mb-2"
                               style="min-height:2.4rem; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;"
                               th:text="${p.descripcion}"
                               th:if="${p.descripcion != null and !#strings.isEmpty(p.descripcion)}">
                                Descripción
                            </p>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span class="precio-badge"
                                      th:text="'$' + ${#numbers.formatDecimal(p.precioBase, 1, 'COMMA', 0, 'POINT')}">
                                    $0
                                </span>
                                <a th:href="@{/productos/{id}/editar(id=${p.id})}"
                                   class="btn btn-outline-dark btn-sm"
                                   title="Editar producto">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
