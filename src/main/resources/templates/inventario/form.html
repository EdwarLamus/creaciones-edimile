<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${insumo != null} ? 'Editar Insumo — Creaciones Edimile' : 'Nuevo Insumo — Creaciones Edimile'">
        Insumo — Creaciones Edimile
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-plus-square me-2 text-warning" th:if="${insumo == null}"></i>
                        <i class="bi bi-pencil-square me-2 text-warning" th:unless="${insumo == null}"></i>
                        <span th:text="${insumo != null} ? 'Editar Insumo' : 'Nuevo Insumo'">Insumo</span>
                    </h3>
                    <p class="text-muted small mb-0"
                       th:text="${insumo != null} ? 'Actualiza la información del insumo.' : 'Registra un nuevo insumo en el inventario.'">
                    </p>
                </div>
                <a th:href="@{/inventario}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Volver al inventario
                </a>
            </div>

            <!-- Formulario -->
            <div class="card border-0 shadow-sm" style="max-width: 600px;">
                <div class="card-body p-4">

                    <form th:action="${insumo != null}
                                     ? @{/inventario/{id}/editar(id=${insumo.id})}
                                     : @{/inventario/nuevo}"
                          method="post"
                          novalidate>

                        <div class="row g-3">

                            <!-- Nombre -->
                            <div class="col-12">
                                <label for="nombre" class="form-label fw-semibold">
                                    Nombre del insumo <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       id="nombre"
                                       name="nombre"
                                       th:value="${insumo?.nombre}"
                                       class="form-control"
                                       placeholder="Ej: Vinilo textil blanco"
                                       required
                                       maxlength="120">
                            </div>

                            <!-- Descripción -->
                            <div class="col-12">
                                <label for="descripcion" class="form-label fw-semibold">
                                    Descripción <span class="text-muted fw-normal">(opcional)</span>
                                </label>
                                <textarea id="descripcion"
                                          name="descripcion"
                                          class="form-control"
                                          rows="2"
                                          placeholder="Marca, referencia, características…"
                                          maxlength="300"
                                          th:text="${insumo?.descripcion}"></textarea>
                            </div>

                            <!-- Unidad de medida -->
                            <div class="col-md-6">
                                <label for="unidadMedida" class="form-label fw-semibold">
                                    Unidad de medida <span class="text-danger">*</span>
                                </label>
                                <select id="unidadMedida" name="unidadMedida"
                                        class="form-select" required>
                                    <option value="" disabled
                                            th:selected="${insumo == null}">Seleccionar…</option>
                                    <option th:each="u : ${ {'unidades','metros','centímetros','kilogramos','gramos','litros','mililitros','rollos','pliegos'} }"
                                            th:value="${u}"
                                            th:text="${u}"
                                            th:selected="${insumo != null and insumo.unidadMedida == u}">
                                    </option>
                                </select>
                            </div>

                            <!-- Precio unitario -->
                            <div class="col-md-6">
                                <label for="precioUnitario" class="form-label fw-semibold">
                                    Precio unitario ($) <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number"
                                           id="precioUnitario"
                                           name="precioUnitario"
                                           th:value="${insumo?.precioUnitario}"
                                           class="form-control"
                                           placeholder="0"
                                           min="0"
                                           step="0.01"
                                           required>
                                </div>
                            </div>

                            <!-- Stock actual (solo al crear) -->
                            <div class="col-md-6" th:if="${insumo == null}">
                                <label for="stockActual" class="form-label fw-semibold">
                                    Stock inicial <span class="text-danger">*</span>
                                </label>
                                <input type="number"
                                       id="stockActual"
                                       name="stockActual"
                                       value="0"
                                       class="form-control"
                                       min="0"
                                       step="0.01"
                                       required>
                                <div class="form-text">
                                    Para ajustar stock después, usa Entrada / Salida.
                                </div>
                            </div>

                            <!-- Stock mínimo -->
                            <div class="col-md-6" th:classappend="${insumo == null} ? '' : 'col-md-12'">
                                <label for="stockMinimo" class="form-label fw-semibold">
                                    Stock mínimo <span class="text-danger">*</span>
                                </label>
                                <input type="number"
                                       id="stockMinimo"
                                       name="stockMinimo"
                                       th:value="${insumo?.stockMinimo} ?: 0"
                                       class="form-control"
                                       min="0"
                                       step="0.01"
                                       required>
                                <div class="form-text">
                                    Se mostrará alerta visual cuando el stock llegue a este nivel.
                                </div>
                            </div>

                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-dark px-4">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${insumo != null} ? 'Guardar cambios' : 'Registrar insumo'">
                                    Guardar
                                </span>
                            </button>
                            <a th:href="@{/inventario}" class="btn btn-outline-secondary px-4">
                                Cancelar
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
