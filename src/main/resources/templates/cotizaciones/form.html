<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${cotizacion != null} ? 'Editar Cotización' : 'Nueva Cotización'">Cotización — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-file-earmark-plus me-2 text-dark"></i>
                        <span th:text="${cotizacion != null} ? 'Editar Cotización ' + ${cotizacion.numero} : 'Nueva Cotización'"></span>
                    </h3>
                    <p class="text-muted small mb-0" th:text="${cotizacion != null} ? 'Modifica los datos de la cotización.' : 'Crea una nueva cotización para un cliente.'"></p>
                </div>
                <a th:href="@{/cotizaciones}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Volver
                </a>
            </div>

            <!-- Formulario -->
            <form th:action="${cotizacion != null} ? @{/cotizaciones/{id}/editar(id=${cotizacion.id})} : @{/cotizaciones/nueva}"
                  method="post" id="formCotizacion">

                <div class="row g-4">
                    <!-- Columna izquierda: cliente + opciones -->
                    <div class="col-lg-4">

                        <!-- Datos generales -->
                        <div class="card border-0 shadow-sm mb-3">
                            <div class="card-header bg-dark text-white fw-semibold py-2">
                                <i class="bi bi-person-circle me-1"></i>Datos de la Cotización
                            </div>
                            <div class="card-body">

                                <!-- Cliente (búsqueda por nombre o documento) -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Cliente <span class="text-danger">*</span></label>

                                    <!-- Campo de búsqueda visible -->
                                    <div class="position-relative">
                                        <span class="position-absolute top-50 start-0 translate-middle-y ps-3 text-muted" style="pointer-events:none;">
                                            <i class="bi bi-search" style="font-size:0.85rem;"></i>
                                        </span>
                                        <input type="text"
                                               id="clienteBuscador"
                                               class="form-control ps-5"
                                               placeholder="Buscar por nombre o documento…"
                                               autocomplete="off"
                                               th:value="${cotizacion != null and cotizacion.clienteNombre != null} ? ${cotizacion.clienteNombre} : ''">
                                    </div>

                                    <!-- Campo oculto que realmente se envía al servidor -->
                                    <input type="hidden"
                                           name="clienteId"
                                           id="clienteIdHidden"
                                           th:value="${cotizacion != null} ? ${cotizacion.clienteId} : ''"
                                           required>

                                    <!-- Dropdown de resultados -->
                                    <div id="clienteSugerencias"
                                         class="list-group shadow-sm mt-1 position-absolute w-100"
                                         style="z-index:1080; max-height:220px; overflow-y:auto; display:none; min-width:260px;">
                                    </div>

                                    <div id="clienteSeleccionado" class="mt-1"
                                         th:if="${cotizacion != null and cotizacion.clienteNombre != null}">
                                        <small class="text-success">
                                            <i class="bi bi-check-circle-fill me-1"></i>
                                            <span th:text="${cotizacion.clienteNombre}"></span>
                                        </small>
                                    </div>
                                    <div id="clienteSeleccionado" class="mt-1" style="display:none;"
                                         th:if="${cotizacion == null or cotizacion.clienteNombre == null}">
                                        <small class="text-success">
                                            <i class="bi bi-check-circle-fill me-1"></i>
                                            <span id="clienteNombreDisplay"></span>
                                        </small>
                                    </div>
                                </div>

                                <!-- Descuento -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Descuento (%)</label>
                                    <input type="number" name="descuentoPct" id="descuentoPct"
                                           class="form-control" min="0" max="100" step="0.1"
                                           th:value="${cotizacion != null} ? ${cotizacion.descuentoPorcentaje} : 0"
                                           value="0">
                                </div>

                                <!-- IVA -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">IVA (%)</label>
                                    <input type="number" name="ivaPct" id="ivaPct"
                                           class="form-control" min="0" max="100" step="0.1"
                                           th:value="${cotizacion != null} ? ${cotizacion.ivaPorcentaje} : 19"
                                           value="19">
                                </div>

                                <!-- Días vigencia -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Días de vigencia</label>
                                    <input type="number" name="diasVigencia" class="form-control"
                                           min="1" max="365" value="30">
                                </div>

                                <!-- Observaciones -->
                                <div class="mb-0">
                                    <label class="form-label fw-semibold small">Observaciones</label>
                                    <textarea name="observaciones" class="form-control" rows="3"
                                              placeholder="Notas adicionales para el cliente…"
                                              th:text="${cotizacion?.observaciones}"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Resumen de totales -->
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-dark text-white fw-semibold py-2">
                                <i class="bi bi-calculator me-1"></i>Resumen
                            </div>
                            <div class="card-body">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted small">Subtotal:</span>
                                    <span class="fw-semibold small" id="resSubtotal">$ 0</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted small">Descuento:</span>
                                    <span class="fw-semibold small text-danger" id="resDescuento">- $ 0</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted small">IVA:</span>
                                    <span class="fw-semibold small" id="resIva">$ 0</span>
                                </div>
                                <hr class="my-2">
                                <div class="d-flex justify-content-between">
                                    <span class="fw-bold">TOTAL:</span>
                                    <span class="fw-bold text-success fs-5" id="resTotal">$ 0</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Columna derecha: ítems -->
                    <div class="col-lg-8">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2">
                                <span><i class="bi bi-list-ul me-1"></i>Ítems de la Cotización</span>
                                <button type="button" class="btn btn-sm btn-outline-light" id="btnAgregarItem">
                                    <i class="bi bi-plus-lg me-1"></i>Agregar ítem
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0" id="tablaItems">
                                        <thead class="table-dark" style="background-color:#333!important">
                                            <tr>
                                                <th style="min-width:180px">Producto</th>
                                                <th style="min-width:160px">Personalización</th>
                                                <th style="width:70px" class="text-center">Cant.</th>
                                                <th style="width:110px" class="text-end">P. Unitario</th>
                                                <th style="width:110px" class="text-end">Subtotal</th>
                                                <th style="width:50px"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="itemsContainer">
                                            <!-- Filas existentes (modo edición) -->
                                            <tr th:each="item, stat : ${cotizacion?.items}"
                                                th:id="'item-row-' + ${stat.index}"
                                                class="item-row">
                                                <td>
                                                    <select th:name="productoIds"
                                                            class="form-select form-select-sm prod-select" required
                                                            data-precio-base="0">
                                                        <option value="">— Producto —</option>
                                                        <option th:each="p : ${productos}"
                                                                th:value="${p.id}"
                                                                th:text="${p.nombre}"
                                                                th:attr="data-precio=${p.precioBase}"
                                                                th:selected="${item.productoId == p.id}">
                                                        </option>
                                                    </select>
                                                </td>
                                                <td>
                                                    <textarea th:name="descripciones"
                                                              class="form-control form-control-sm"
                                                              rows="2"
                                                              placeholder="Detalles personalizados…"
                                                              style="resize:vertical; min-height:54px;"
                                                              th:text="${item.descripcionPersonalizacion}"></textarea>
                                                </td>
                                                <td>
                                                    <input th:name="cantidades" type="number"
                                                           class="form-control form-control-sm text-center cant-input"
                                                           min="1" th:value="${item.cantidad}" value="1">
                                                </td>
                                                <td>
                                                    <input th:name="precios" type="number"
                                                           class="form-control form-control-sm text-end precio-input"
                                                           min="0" step="0.01" th:value="${item.precioUnitario}" value="0">
                                                </td>
                                                <td class="text-end">
                                                    <span class="subtotal-span fw-semibold small"
                                                          th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}">0</span>
                                                </td>
                                                <td class="text-center">
                                                    <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar-item">
                                                        <i class="bi bi-trash3"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- Placeholder cuando no hay ítems -->
                                <div id="noItemsMsg" class="text-center text-muted py-4"
                                     th:style="${cotizacion != null and not #lists.isEmpty(cotizacion.items)} ? 'display:none' : ''">
                                    <i class="bi bi-box-seam fs-3 d-block mb-2 text-secondary"></i>
                                    Haz clic en <strong>"Agregar ítem"</strong> para añadir productos.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botones de acción -->
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/cotizaciones}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg me-1"></i>Cancelar
                    </a>
                    <button type="submit" class="btn btn-dark px-4">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="${cotizacion != null} ? 'Guardar cambios' : 'Crear cotización'"></span>
                    </button>
                </div>

            </form>
        </div><!-- /page-content -->
    </div><!-- /wrapper -->

    <!-- Template de fila de ítem (oculto, usado por JS) -->
    <template id="itemRowTemplate">
        <tr class="item-row">
            <td>
                <select name="productoIds" class="form-select form-select-sm prod-select" required>
                    <option value="">— Producto —</option>
                    <!--PRODUCTOS_OPTIONS-->
                </select>
            </td>
            <td>
                <textarea name="descripciones" class="form-control form-control-sm"
                          rows="2" placeholder="Detalles personalizados…"
                          style="resize:vertical; min-height:54px;"></textarea>
            </td>
            <td>
                <input name="cantidades" type="number" class="form-control form-control-sm text-center cant-input"
                       min="1" value="1">
            </td>
            <td>
                <input name="precios" type="number" class="form-control form-control-sm text-end precio-input"
                       min="0" step="0.01" value="0">
            </td>
            <td class="text-end">
                <span class="subtotal-span fw-semibold small">$ 0</span>
            </td>
            <td class="text-center">
                <button type="button" class="btn btn-sm btn-outline-danger btn-eliminar-item">
                    <i class="bi bi-trash3"></i>
                </button>
            </td>
        </tr>
    </template>

    <!-- Datos de productos y clientes para JS -->
    <script th:inline="javascript">
        const productosData = /*[[${productos}]]*/ [];
        const clientesData  = /*[[${clientes}]]*/ [];
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/cotizacion-form.js}"></script>

    <!-- Búsqueda de cliente -->
    <script>
    (function() {
        var input        = document.getElementById('clienteBuscador');
        var hiddenId     = document.getElementById('clienteIdHidden');
        var sugerencias  = document.getElementById('clienteSugerencias');
        var selDisplay   = document.getElementById('clienteSeleccionado');
        var nombreSpan   = document.getElementById('clienteNombreDisplay');

        if (!input) return;

        function normStr(s) {
            return (s || '').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');
        }

        function renderSugerencias(lista) {
            sugerencias.innerHTML = '';
            if (lista.length === 0) {
                sugerencias.style.display = 'none';
                return;
            }
            lista.forEach(function(c) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'list-group-item list-group-item-action py-2 px-3';
                btn.style.fontSize = '0.875rem';
                var nombreCompleto = c.nombre + ' ' + c.apellido;
                btn.innerHTML =
                    '<span class="fw-semibold">' + escHtml(nombreCompleto) + '</span>' +
                    '<span class="text-muted ms-2 small">' + escHtml(c.tipoDocumento || '') + ' ' + escHtml(c.numeroDocumento || '') + '</span>';
                btn.addEventListener('click', function() {
                    seleccionarCliente(c.id, nombreCompleto);
                });
                sugerencias.appendChild(btn);
            });
            sugerencias.style.display = 'block';
        }

        function seleccionarCliente(id, nombre) {
            hiddenId.value   = id;
            input.value      = nombre;
            if (nombreSpan) nombreSpan.textContent = nombre;
            if (selDisplay) selDisplay.style.display = '';
            sugerencias.style.display = 'none';
        }

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        input.addEventListener('input', function() {
            var q = normStr(input.value.trim());
            if (hiddenId.value) hiddenId.value = '';
            if (selDisplay)     selDisplay.style.display = 'none';
            if (!q) { sugerencias.style.display = 'none'; return; }

            var filtrados = clientesData.filter(function(c) {
                var nombre = normStr((c.nombre || '') + ' ' + (c.apellido || ''));
                var doc    = normStr(c.numeroDocumento || '');
                var emp    = normStr(c.empresa || '');
                return nombre.includes(q) || doc.includes(q) || emp.includes(q);
            }).slice(0, 10);

            renderSugerencias(filtrados);
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') sugerencias.style.display = 'none';
        });

        document.addEventListener('click', function(e) {
            if (!input.contains(e.target) && !sugerencias.contains(e.target)) {
                sugerencias.style.display = 'none';
                // Si no hay ID seleccionado y hay texto, limpiar
                if (!hiddenId.value && input.value.trim()) {
                    input.value = '';
                    if (selDisplay) selDisplay.style.display = 'none';
                }
            }
        });

        // Hacer que el campo contenedor sea relativo para el dropdown
        if (input.parentElement && input.parentElement.parentElement) {
            input.parentElement.parentElement.style.position = 'relative';
        }
    })();
    </script>
</body>
</html>
