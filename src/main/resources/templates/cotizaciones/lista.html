<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizaciones — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-file-earmark-text me-2 text-dark"></i>Cotizaciones
                    </h3>
                    <p class="text-muted small mb-0">Gestión y seguimiento de cotizaciones a clientes.</p>
                </div>
                <a th:href="@{/cotizaciones/nueva}" class="btn btn-dark">
                    <i class="bi bi-plus-lg me-1"></i>Nueva Cotización
                </a>
            </div>

            <!-- Filtros -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body py-3">
                    <form method="get" th:action="@{/cotizaciones}" class="row g-2 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label small fw-semibold mb-1">Buscar</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" name="q" class="form-control"
                                       placeholder="Número, cliente o vendedor…"
                                       th:value="${q}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold mb-1">Estado</label>
                            <select name="estado" class="form-select">
                                <option value="">— Todos —</option>
                                <option th:each="e : ${estados}"
                                        th:value="${e.name()}"
                                        th:text="${e.name()}"
                                        th:selected="${e.name() == estadoFiltro}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-dark w-100">
                                <i class="bi bi-funnel-fill me-1"></i>Filtrar
                            </button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/cotizaciones}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-x-lg me-1"></i>Limpiar
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabla -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Número</th>
                                    <th>Cliente</th>
                                    <th>Vendedor</th>
                                    <th class="text-center">Fecha</th>
                                    <th class="text-center">Vence</th>
                                    <th class="text-end">Total</th>
                                    <th class="text-center">Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(cotizaciones)}">
                                    <td colspan="8" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        No hay cotizaciones registradas.
                                    </td>
                                </tr>
                                <tr th:each="cot : ${cotizaciones}">
                                    <td>
                                        <a th:href="@{/cotizaciones/{id}(id=${cot.id})}"
                                           class="fw-semibold text-dark text-decoration-none"
                                           th:text="${cot.numero}">COT-0001</a>
                                    </td>
                                    <td th:text="${cot.clienteNombre}">—</td>
                                    <td th:text="${cot.usuarioNombre}">—</td>
                                    <td class="text-center small">
                                        <span th:if="${cot.fechaCreacion != null}"
                                              th:text="${#temporals.format(cot.fechaCreacion.toDate().toInstant().atZone(T(java.time.ZoneId).of('America/Bogota')), 'dd/MM/yyyy')}">
                                        </span>
                                        <span th:if="${cot.fechaCreacion == null}">—</span>
                                    </td>
                                    <td class="text-center small">
                                        <span th:if="${cot.fechaVencimiento != null}"
                                              th:text="${#temporals.format(cot.fechaVencimiento.toDate().toInstant().atZone(T(java.time.ZoneId).of('America/Bogota')), 'dd/MM/yyyy')}">
                                        </span>
                                        <span th:if="${cot.fechaVencimiento == null}">—</span>
                                    </td>
                                    <td class="text-end fw-semibold"
                                        th:text="${#numbers.formatDecimal(cot.total, 1, 'COMMA', 0, 'POINT')}">
                                    </td>
                                    <td class="text-center">
                                        <span th:switch="${cot.estado != null ? cot.estado.name() : 'PENDIENTE'}">
                                            <span th:case="'PENDIENTE'"  class="badge bg-warning text-dark">PENDIENTE</span>
                                            <span th:case="'APROBADA'"   class="badge bg-success">APROBADA</span>
                                            <span th:case="'RECHAZADA'"  class="badge bg-danger">RECHAZADA</span>
                                            <span th:case="'VENCIDA'"    class="badge bg-secondary">VENCIDA</span>
                                            <span th:case="*"            class="badge bg-secondary" th:text="${cot.estado}"></span>
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <div class="btn-group btn-group-sm">
                                            <!-- Ver detalle -->
                                            <a th:href="@{/cotizaciones/{id}(id=${cot.id})}"
                                               class="btn btn-outline-dark" title="Ver detalle">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                            <!-- Editar (solo PENDIENTE) -->
                                            <a th:if="${cot.pendiente}"
                                               th:href="@{/cotizaciones/{id}/editar(id=${cot.id})}"
                                               class="btn btn-outline-secondary" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <!-- Descargar PDF -->
                                            <a th:href="@{/cotizaciones/{id}/pdf(id=${cot.id})}"
                                               class="btn btn-outline-danger" title="Descargar PDF">
                                                <i class="bi bi-filetype-pdf"></i>
                                            </a>
                                        </div>
                                        <!-- Eliminar (solo ADMIN) -->
                                        <form th:action="@{/cotizaciones/{id}/eliminar(id=${cot.id})}"
                                              method="post" class="d-inline ms-1"
                                              sec:authorize="hasRole('ADMIN')"
                                              onsubmit="return confirm('\u00bfEst\u00e1 seguro de eliminar esta cotizaci\u00f3n? Esta acci\u00f3n no se puede deshacer.')">
                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger"
                                                    title="Eliminar">
                                                <i class="bi bi-trash3"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div><!-- /page-content -->
    </div><!-- /wrapper -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
