<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios — Creaciones Edimile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="d-flex" id="wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div id="page-content" class="flex-grow-1">

            <!-- Encabezado -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="bi bi-person-gear me-2 text-danger"></i>Gestión de Usuarios
                    </h3>
                    <p class="text-muted small mb-0">
                        Administra los accesos al sistema y los roles de cada usuario.
                    </p>
                </div>
                <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-danger">
                    <i class="bi bi-plus-circle me-1"></i>Nuevo Usuario
                </a>
            </div>

            <!-- Mensajes flash -->
            <div th:if="${successMsg}"
                 class="alert alert-success alert-dismissible fade show d-flex align-items-center"
                 role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}"
                 class="alert alert-danger alert-dismissible fade show d-flex align-items-center"
                 role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
            </div>

            <!-- Tabla de usuarios -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr class="table-dark">
                                    <th class="ps-4 py-3">Nombre</th>
                                    <th class="py-3">Correo electrónico</th>
                                    <th class="py-3">Rol</th>
                                    <th class="py-3">Estado</th>
                                    <th class="py-3 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${usuarios}">
                                    <td class="ps-4">
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="avatar-circle bg-secondary text-white">
                                                <span th:text="${#strings.toUpperCase(#strings.substring(u.nombre, 0, 1))}">A</span>
                                            </div>
                                            <div>
                                                <div class="fw-semibold"
                                                     th:text="${u.nombre + ' ' + u.apellido}">
                                                    Nombre Apellido
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="text-muted" th:text="${u.email}">email@ejemplo.com</td>
                                    <td>
                                        <span th:if="${u.rol == 'ADMIN'}"
                                              class="badge bg-danger-subtle text-danger border border-danger-subtle">
                                            <i class="bi bi-shield-fill me-1"></i>Administrador
                                        </span>
                                        <span th:if="${u.rol == 'VENDEDOR'}"
                                              class="badge bg-primary-subtle text-primary border border-primary-subtle">
                                            <i class="bi bi-person-fill me-1"></i>Vendedor
                                        </span>
                                    </td>
                                    <td>
                                        <span th:if="${u.activo}"
                                              class="badge bg-success-subtle text-success border border-success-subtle">
                                            <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Activo
                                        </span>
                                        <span th:unless="${u.activo}"
                                              class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">
                                            <i class="bi bi-circle me-1" style="font-size: 0.5rem;"></i>Inactivo
                                        </span>
                                    </td>
                                    <td class="text-center">
                                        <!-- Botón Activar / Desactivar -->
                                        <form th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}"
                                              method="post"
                                              class="d-inline">
                                            <input type="hidden" name="activo" th:value="${!u.activo}">
                                            <button type="submit"
                                                    class="btn btn-sm"
                                                    th:classappend="${u.activo} ? 'btn-outline-warning' : 'btn-outline-success'"
                                                    th:title="${u.activo} ? 'Desactivar usuario' : 'Activar usuario'"
                                                    th:attr="onclick=${u.activo} ? 'return confirm(\'¿Desactivar este usuario?\')' : 'return confirm(\'¿Activar este usuario?\')'">
                                                <i class="bi"
                                                   th:classappend="${u.activo} ? 'bi-person-dash' : 'bi-person-check'"></i>
                                                <span th:text="${u.activo} ? 'Desactivar' : 'Activar'">Acción</span>
                                            </button>
                                        </form>
                                    </td>
                                </tr>

                                <!-- Estado vacío -->
                                <tr th:if="${#lists.isEmpty(usuarios)}">
                                    <td colspan="5" class="text-center text-muted py-5">
                                        <i class="bi bi-people fs-1 d-block mb-2 text-secondary"></i>
                                        No hay usuarios registrados en el sistema.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
